version: 2

project_name: cinzel

before:
  hooks:
    - go mod tidy

builds:
  - id: cinzel
    main: .
    binary: cinzel
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: cinzel
    ids:
      - cinzel
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto

changelog:
  disable: true

homebrew_casks:
  - name: cinzel
    binaries:
      - cinzel
    repository:
      owner: yldio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/yldio/cinzel
    description: Bidirectional converter between HCL and CI/CD YAML
    license: Apache-2.0
    hooks:
      post:
        # Homebrew deprecated the "postflight" stanza the raw-Ruby "install"
        # hook writes, so every install printed a warning telling the user to
        # report it to the tap. "install_steps" writes "postflight_steps",
        # which takes Homebrew's declarative DSL rather than arbitrary Ruby:
        # "on_macos" for the guard, "run" for the command.
        #
        # StagedPath is GoReleaser's own field for Homebrew's "staged_path"
        # token, which uses the same delimiters as a GoReleaser template and
        # would otherwise have to be escaped.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/cinzel"]
          end

[tools]
actionlint = "latest"
ghalint = "latest"
git-cliff = "2.14.1"
go = "1.27"

[env]
COVERAGE_PATH="./coverage"
COVERAGE_REPORT_PATH="{{env.COVERAGE_PATH}}/coverage.out"
COVERAGE_HTML_PATH="{{env.COVERAGE_PATH}}/coverage.html"

[tasks.cinzel]
run = "go run ./..."

[tasks.pkgsite]
run = "go tool pkgsite"

[tasks.fmt]
run = """
go fmt ./...
go tool hclfmt -w ./**/*.hcl
"""

[tasks.build]
depends = ["test-ci"]
run = """
VERSION="${VERSION:-$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')}"
VERSION="${VERSION#v}"
if [ -z "$VERSION" ]; then
  VERSION="dev-$(git rev-parse --short HEAD)"
fi
rm -rf ./bin
go build -ldflags "-s -w -X main.version=$VERSION" -o ./bin/cinzel ./cinzel.go
"""

[tasks.changelog]
run = "git cliff --offline --output CHANGELOG.md"

[tasks.coverpath]
run = "mkdir -p ./coverage"

[tasks.lint]
# gofmt writes nothing here: a formatting drift is a CI failure, not a
# silent rewrite.
run = """
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "not gofmt'd:"
  echo "$unformatted"
  exit 1
fi
go vet ./...
actionlint .github/workflows/*.yaml
ghalint run
"""

[tasks.drift]
# The repo's own workflows are generated from cinzel/*.hcl by cinzel itself.
# Editing .github/workflows by hand leaves the two out of step until the next
# regeneration silently reverts it, so the check runs in CI.
run = """
out=$(mktemp -d)
go run . github parse --file cinzel --output-directory "$out"
diff -ru .github/workflows "$out"
"""

[tasks.test-ci]
run = "go test ./... --cover"

[tasks.test]
depends = ["coverpath"]
run = "go test ./... --cover -coverprofile=${COVERAGE_REPORT_PATH}"

[tasks.report]
depends = ["test"]
run = "go tool cover -html=${COVERAGE_REPORT_PATH} -o ${COVERAGE_HTML_PATH}"

[tasks.license]
# Casks/ is GoReleaser output and says not to edit it. A release
# rewrites it in the tap, so a header added here would not survive.
run = "go tool addlicense -v -ignore '**/*.hcl' -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.md' -ignore 'Casks/**' -l apache -s=only -c 'YLD Limited' ."

[tasks.license-check]
run = "go tool addlicense -check -ignore '**/*.hcl' -ignore '**/*.yaml' -ignore '**/*.yml' -ignore '**/*.md' -ignore 'Casks/**' ."

[tasks.bench]
run = """
go test ./provider/github -run '^$' -bench 'Benchmark' -benchmem
"""

# generated-by: cinzel
# cinzel-provider: github
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty for auto-calculation)
        required: false
        type: string
permissions:
  contents: read
jobs:
  release:
    name: Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - env:
          RELEASE_APP_ID: "${{ secrets.RELEASE_APP_ID }}"
          RELEASE_PRIVATE_KEY: "${{ secrets.RELEASE_PRIVATE_KEY }}"
        id: ensure_release_app
        name: Ensure release app credentials
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_APP_ID" ] || [ -z "$RELEASE_PRIVATE_KEY" ]; then
            echo "RELEASE_APP_ID and RELEASE_PRIVATE_KEY secrets are required for release automation"
            exit 1
          fi
      - id: release_app_token
        name: Create release app token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        with:
          app-id: "${{ secrets.RELEASE_APP_ID }}"
          # Everything this token does is contents-level: tag, commit the changelog,
          # create the release, upload its assets and push the homebrew cask. Without
          # an explicit scope the token carries every permission the app was granted.
          permission-contents: write
          private-key: "${{ secrets.RELEASE_PRIVATE_KEY }}"
          repositories: "cinzel,homebrew-cinzel"
      - id: checkout_release
        name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: "0"
          persist-credentials: "false"
      - env:
          GH_TOKEN: "${{ steps.release_app_token.outputs.token }}"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ steps.release_app_token.outputs.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
        id: verify_release_token
        name: Verify the release token before anything changes
        # The release job's first mutation pushes a tag. Everything after it
        # assumes the token can write and that the credentials the pushing steps
        # carry in their environment actually authenticate, and neither is
        # checkable until it is used. Both are checked here instead, while the
        # repository is still untouched: a scope that turns out to be too narrow
        # fails before the tag exists rather than after.
        #
        # homebrew-cinzel is checked here too. It is pushed by the release-packages
        # job, which this job triggers by creating the release, so this is the last
        # point where a missing scope can be reported without a release already
        # being published.
        #
        # Scope is what is checkable here, not permission. The token is an app
        # installation token, so "repos/$repo" was the wrong place to ask: its
        # "permissions" object describes the authenticated user, and an
        # installation token has no user behind it, so the field came back absent
        # and the check could never pass. /installation/repositories answers for
        # the installation itself, which is what the token actually is.
        #
        # contents:write is settled at mint time — create-github-app-token fails
        # when the installation was never granted a permission the step asks for —
        # and the dry run below proves it for this repository outright.
        run: |
          set -euo pipefail

          scoped=$(gh api /installation/repositories --paginate --jq '.repositories[].full_name')

          for repo in "$GITHUB_REPOSITORY" yldio/homebrew-cinzel; do
            if ! printf '%s\n' "$scoped" | grep -qxF "$repo"; then
              echo "the release token is not scoped to $repo"
              echo "it reaches: $scoped"
              exit 1
            fi
          done

          # Never writes, but the server still runs its permission check on
          # git-receive-pack, so a read-only token fails here rather than at the tag.
          git push --dry-run origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - id: mise_setup
        name: Setup mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4
        with:
          cache: "true"
          install: "true"
      - id: tests
        name: Tests
        run: mise run test-ci
      - id: calculate_next_version
        name: Calculate next version
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8
        with:
          branch: main
          patchList: "fix, perf, refactor"
          token: "${{ github.token }}"
      - id: resolve_release_tag
        name: Resolve release tag
        run: |
          set -euo pipefail

          input_tag="${{ github.event.inputs.tag }}"
          input_tag="${input_tag#v}"
          calculated_tag="${{ steps.calculate_next_version.outputs.nextStrict }}"
          bump="${{ steps.calculate_next_version.outputs.bump }}"

          if [ -n "$input_tag" ]; then
            echo "using manual tag: $input_tag"
            echo "tag=$input_tag" >> "$GITHUB_OUTPUT"
          elif [ "$bump" != "none" ] && [ -n "$calculated_tag" ]; then
            echo "using calculated tag: $calculated_tag (bump: $bump)"
            echo "tag=$calculated_tag" >> "$GITHUB_OUTPUT"
          else
            echo "no releasable commits and no manual tag provided"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - id: tag_version
        if: "${{ steps.resolve_release_tag.outputs.skip != 'true' }}"
        name: Bump version and push tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b
        with:
          custom_tag: "${{ steps.resolve_release_tag.outputs.tag }}"
          github_token: "${{ steps.release_app_token.outputs.token }}"
      - env:
          GITHUB_REPO: "${{ github.repository }}"
          OUTPUT: CHANGELOG.md
        id: git_cliff_changelog
        name: Generate full changelog
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72
        with:
          args: "--offline --verbose --tag ${{ steps.tag_version.outputs.new_tag }}"
          config: cliff.toml
          github_token: "${{ steps.release_app_token.outputs.token }}"
      - env:
          GITHUB_REPO: "${{ github.repository }}"
        id: git_cliff
        name: Generate release notes
        uses: orhun/git-cliff-action@c93ef52f3d0ddcdcc9bd5447d98d458a11cd4f72
        with:
          args: "--offline --verbose --unreleased --tag ${{ steps.tag_version.outputs.new_tag }}"
          config: cliff.toml
          github_token: "${{ steps.release_app_token.outputs.token }}"
      - env:
          # The action pushes the changelog commit with a bare "git push origin" and
          # takes no token for it. The credentials go in this step's environment, so
          # the checkout leaves nothing in .git/config for the earlier steps to read.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ steps.release_app_token.outputs.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
        id: commit_release
        name: Commit release changelog
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          branch: "${{ github.ref_name }}"
          commit_message: "chore(release): prepare for ${{ steps.tag_version.outputs.new_tag }} [skip ci]"
          file_pattern: CHANGELOG.md
      - id: create_release
        name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          body: "${{ steps.git_cliff.outputs.content }}"
          tag: "${{ steps.tag_version.outputs.new_tag }}"
          token: "${{ steps.release_app_token.outputs.token }}"
    timeout-minutes: 20

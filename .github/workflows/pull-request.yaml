# generated-by: cinzel
# cinzel-provider: github
name: Pull Request
on:
  pull_request:
permissions:
  contents: write
  pull-requests: write
jobs:
  pull_request:
    name: "${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"
      - id: mise_setup
        name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: "true"
          install: "true"
      - id: tests
        name: Tests
        run: mise run test-ci
      - id: lint
        if: "${{ matrix.os == 'ubuntu-24.04' }}"
        name: Lint
        run: mise run lint
      - id: drift
        if: "${{ matrix.os == 'ubuntu-24.04' }}"
        name: Generated workflows match their HCL
        run: mise run drift
      - env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
        id: coverage
        if: "${{ matrix.os == 'ubuntu-24.04' }}"
        name: Coverage
        uses: gwatts/go-coverage-action@2845595538a59d63d1bf55f109c14e104c6f7cb3
    strategy:
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2022
    timeout-minutes: 5

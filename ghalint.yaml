# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/ghalint/v1.5.6/json-schema/ghalint.json

excludes:
  # stefanzweifel/git-auto-commit-action pushes the changelog commit with the
  # credentials actions/checkout leaves in .git/config, so this one checkout
  # has to keep them. The token is the release app's, scoped to contents.
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/release.yaml
    job_name: release
    step_id: checkout_release_with_credentials

  # gwatts/go-coverage-action pushes refs/notes/gocoverage with a bare
  # "git push origin", using the credentials actions/checkout leaves in
  # .git/config, and takes no token for the push. This second checkout runs
  # immediately before it and exists only to put them there, so the job's
  # first checkout can drop them and the tests and linters run without a
  # token sitting in .git/config.
  - policy_name: checkout_persist_credentials_should_be_false
    workflow_file_path: .github/workflows/pull-request.yaml
    job_name: pull_request
    step_id: checkout_for_coverage
